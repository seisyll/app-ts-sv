# ―― » The production image ( Dockerfile ), pushed to GitHub's registry as
#      ghcr.io/<owner>/<repo>: :latest from main, :<tag> from a version tag ( v1.2.0 ), and
#      :sha-<commit> from both. A server pulls it ( deploy/README.md ).
#
#      Which client config it builds: the repository variable CLIENT ( Settings → Secrets and
#      variables → Actions → Variables ), else default. One image per client? Add a matrix.
name: Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CLIENT=${{ vars.CLIENT || 'default' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
