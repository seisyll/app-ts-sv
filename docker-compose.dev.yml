# Local Postgres ( and Redis ) for development: bun run db:setup ( starts them, migrates,
# provisions, seeds ). Bound to 127.0.0.1 on uncommon ports ( 5433, 6380 ) so they neither
# clash with local servers nor face the network.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      # Postgres 18 images keep data under a versioned subfolder of this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [ CMD-SHELL, pg_isready -U postgres -d app ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional ( REDIS_URL ): shared counters for the sign-in throttle. Nothing is kept on disk.
  redis:
    image: redis:8-alpine
    ports:
      - 127.0.0.1:6380:6379
    healthcheck:
      test: [ CMD, redis-cli, ping ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
