<!doctype html>
<!-- Shown only when SvelteKit can't render the app at all ( the root layout or +error.svelte
     itself failed ), so it stands alone: no app CSS, no scripts. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · %sveltekit.error.message%</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				font-family: system-ui, sans-serif;
				text-align: center;
				color: #171717;
				background: #fff;
			}

			p {
				margin: 0.5rem 0;
				color: #737373;
			}

			a {
				color: inherit;
			}

			@media (prefers-color-scheme: dark) {
				body {
					color: #fafafa;
					background: #0a0a0a;
				}
			}
		</style>
	</head>
	<body>
		<div>
			<p>%sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<p><a href="/">Home</a></p>
		</div>
	</body>
</html>
